<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Animado - Roberta Emiliana Dosantos Riveroll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cinzel', serif;
            background-color: #F7F3E9;
            overflow: hidden;
            user-select: none;
        }
        
        .paper-bg {
            background-color: #F7F3E9;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.8) 0%, rgba(247, 243, 233, 0.4) 60%, rgba(225, 215, 195, 0.7) 100%),
                radial-gradient(#d5c3aa 0.75px, transparent 0.75px), 
                radial-gradient(#d5c3aa 0.75px, #F7F3E9 0.75px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            background-position: 0 0, 0 0, 15px 15px;
        }

        /* Keyframes CSS */
        @keyframes wingFlapLeft {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-8deg) scaleX(0.96) translateY(-2px); }
        }

        @keyframes wingFlapRight {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(8deg) scaleX(0.96) translateY(-2px); }
        }

        @keyframes floatRise {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-14px); }
        }

        @keyframes compassRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.35; transform: scale(0.98); }
            50% { opacity: 0.8; transform: scale(1.03); }
        }

        .animate-wing-left {
            transform-origin: 90% 65%;
            animation: wingFlapLeft 3.2s ease-in-out infinite;
        }

        .animate-wing-right {
            transform-origin: 10% 65%;
            animation: wingFlapRight 3.2s ease-in-out infinite;
        }

        .animate-float-monogram {
            animation: floatRise 4.5s ease-in-out infinite;
        }

        .animate-compass {
            transform-origin: 300px 240px;
            animation: compassRotate 45s linear infinite;
        }

        .animate-glow {
            transform-origin: 300px 240px;
            animation: pulseGlow 4s ease-in-out infinite;
        }

        .gold-shimmer-text {
            background: linear-gradient(135deg, #A80018 0%, #E60026 30%, #FFD700 50%, #E60026 70%, #800010 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shineText 5s linear infinite;
        }

        @keyframes shineText {
            to { background-position: 200% center; }
        }
    </style>
</head>

    <script>
        const FIRST_NAME = "ROBERTA EMILIANA";
        const LAST_NAME = "DOSANTOS RIVEROLL";

        let audioCtx = null;
        let isAudioEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled;
            document.getElementById('audioStatus').innerText = isAudioEnabled ? "SONIDO: ACTIVADO" : "SONIDO: DESACTIVADO";
            document.getElementById('audioIcon').innerText = isAudioEnabled ? "🔊" : "🔇";
            if (isAudioEnabled) initAudio();
        }

        function playWingSwooshSound() {
            if (!isAudioEnabled) return;
            initAudio();

            const bufferSize = audioCtx.sampleRate * 0.8;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(120, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(650, audioCtx.currentTime + 0.35);
            filter.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.75);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + 0.3);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.78);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start();
        }

        function playLuxuryChimeSound() {
            if (!isAudioEnabled) return;
            initAudio();

            const freqs = [528, 660, 792, 1056, 1320];
            freqs.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.06);

                gain.gain.setValueAtTime(0.001, audioCtx.currentTime + idx * 0.06);
                gain.gain.linearRampToValueAtTime(0.06 / (idx + 1), audioCtx.currentTime + idx * 0.06 + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + idx * 0.06 + 2.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(audioCtx.currentTime + idx * 0.06);
                osc.stop(audioCtx.currentTime + idx * 0.06 + 2.3);
            });
        }

        function playSoftTypeTick() {
            if (!isAudioEnabled) return;
            initAudio();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440 + Math.random() * 80, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.04);

            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.045);
        }

        const canvas = document.getElementById('sparkleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y) {
                this.x = x || canvas.width / 2 + (Math.random() - 0.5) * 260;
                this.y = y || canvas.height / 2 + (Math.random() - 0.5) * 200;
                this.size = Math.random() * 3.5 + 1;
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.speedY = (Math.random() - 0.5) * 1.5 - 0.5;
                this.color = Math.random() > 0.4 ? '#FFD700' : '#E60026';
                this.life = 1;
                this.decay = Math.random() * 0.02 + 0.008;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                if (this.size > 2.5) {
                    ctx.strokeStyle = '#FFF7D6';
                    ctx.lineWidth = 0.8;
                    ctx.beginPath();
                    ctx.moveTo(this.x - this.size * 2, this.y);
                    ctx.lineTo(this.x + this.size * 2, this.y);
                    ctx.moveTo(this.x, this.y - this.size * 2);
                    ctx.lineTo(this.x, this.y + this.size * 2);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        function triggerSparkleBurst(count = 35) {
            const rect = document.getElementById('logoSvg').getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height * 0.45;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(centerX, centerY));
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, idx) => {
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(idx, 1);
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        let animationTimeout = null;

        function startAnimationSequence() {
            initAudio();

            const firstNameEl = document.getElementById('firstNameText');
            const lastNameEl = document.getElementById('lastNameText');
            const textDivider = document.getElementById('textDivider');
            const monogramGroup = document.getElementById('monogramGroup');

            firstNameEl.textContent = "";
            lastNameEl.textContent = "";
            textDivider.style.opacity = "0";
            
            if (animationTimeout) clearTimeout(animationTimeout);

            monogramGroup.style.transform = "translateY(25px) scale(0.92)";
            monogramGroup.style.transition = "transform 1.4s cubic-bezier(0.25, 1, 0.5, 1)";
            
            playWingSwooshSound();

            setTimeout(() => {
                monogramGroup.style.transform = "translateY(0px) scale(1)";
                triggerSparkleBurst(45);
                playLuxuryChimeSound();
            }, 500);

            let firstIdx = 0;
            setTimeout(() => {
                const typeFirst = setInterval(() => {
                    if (firstIdx < FIRST_NAME.length) {
                        firstNameEl.textContent += FIRST_NAME.charAt(firstIdx);
                        playSoftTypeTick();
                        firstIdx++;
                    } else {
                        clearInterval(typeFirst);
                        textDivider.style.opacity = "1";
                        
                        let lastIdx = 0;
                        setTimeout(() => {
                            const typeLast = setInterval(() => {
                                if (lastIdx < LAST_NAME.length) {
                                    lastNameEl.textContent += LAST_NAME.charAt(lastIdx);
                                    playSoftTypeTick();
                                    lastIdx++;
                                } else {
                                    clearInterval(typeLast);
                                    triggerSparkleBurst(25);
                                }
                            }, 50);
                        }, 300);
                    }
                }, 75);
            }, 1200);
        }

        // EXPORTADOR CORREGIDO: INCLUYE ANIMACIÓN COMPLETA DE ALETEO DE ALAS Y BRÚJULA GIRATORIA
        async function exportVideo() {
            const downloadBtn = document.getElementById('downloadBtn');
            const statusEl = document.getElementById('recordingStatus');

            downloadBtn.disabled = true;
            downloadBtn.style.opacity = "0.5";
            statusEl.classList.remove('hidden');

            const recordCanvas = document.createElement('canvas');
            recordCanvas.width = 1280;
            recordCanvas.height = 1024;
            const rCtx = recordCanvas.getContext('2d');

            const stream = recordCanvas.captureStream(30);
            let recorder;
            try {
                recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
            } catch (e) {
                recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            }

            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'Roberta_Emiliana_Logo_Animado_Completo.webm';
                a.click();

                downloadBtn.disabled = false;
                downloadBtn.style.opacity = "1";
                statusEl.classList.add('hidden');
            };

            recorder.start();
            startAnimationSequence();

            const svgElement = document.getElementById('logoSvg');
            const startTime = Date.now();
            const duration = 6500;

            let isRendering = true;

            function processFrame() {
                if (!isRendering) return;
                const now = Date.now();
                const elapsed = (now - startTime) / 1000;

                if (now - startTime < duration) {
                    // Clonar SVG e inyectar transformaciones explícitas para capturar rotación de la brújula y aleteo en el video
                    const clone = svgElement.cloneNode(true);
                    
                    const compass = clone.querySelector('#compassGroup');
                    if (compass) {
                        const deg = (elapsed * 8) % 360; // 8 deg/sec
                        compass.setAttribute('transform', `rotate(${deg}, 300, 240)`);
                    }

                    const wingL = clone.querySelector('#wingLeftEl');
                    const wingR = clone.querySelector('#wingRightEl');
                    if (wingL && wingR) {
                        const flap = Math.sin(elapsed * 2) * 8;
                        wingL.setAttribute('transform', `rotate(${-flap}, 235, 220)`);
                        wingR.setAttribute('transform', `rotate(${flap}, 365, 220)`);
                    }

                    const xml = new XMLSerializer().serializeToString(clone);
                    const svgBlob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
                    const URLObj = window.URL || window.webkitURL || window;
                    const blobUrl = URLObj.createObjectURL(svgBlob);

                    const img = new Image();
                    img.onload = () => {
                        rCtx.fillStyle = '#F7F3E9';
                        rCtx.fillRect(0, 0, recordCanvas.width, recordCanvas.height);
                        rCtx.drawImage(img, 140, 110, 1000, 800);
                        URLObj.revokeObjectURL(blobUrl);
                        if (isRendering) requestAnimationFrame(processFrame);
                    };
                    img.src = blobUrl;
                } else {
                    isRendering = false;
                    recorder.stop();
                }
            }

            processFrame();
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(startAnimationSequence, 600);
        });
    </script>
</body>
</html>
